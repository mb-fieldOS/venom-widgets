<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENOM Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  .container {
    text-align: center;
    position: relative;
  }

  /* Subtle scan line effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.012) 2px,
      rgba(255,255,255,0.012) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* Ambient glow */
  .glow-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(220,38,38,0.06) 0%, transparent 70%);
    pointer-events: none;
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  }

  /* Time display */
  .time {
    font-size: clamp(52px, 12vw, 80px);
    font-weight: 400;
    letter-spacing: 0.08em;
    color: #f5f5f5;
    line-height: 1;
    position: relative;
    text-shadow: 0 0 40px rgba(220,38,38,0.15);
    animation: flicker 8s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 94%, 96%, 100% { opacity: 1; }
    95% { opacity: 0.92; }
  }

  .time .colon {
    color: #dc2626;
    animation: blink 1s step-end infinite;
    display: inline-block;
    margin: 0 2px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }

  /* Seconds */
  .seconds {
    font-size: clamp(16px, 3vw, 22px);
    color: #dc2626;
    letter-spacing: 0.2em;
    margin-top: 6px;
    opacity: 0.9;
  }

  /* Divider */
  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #dc2626, transparent);
    margin: 14px auto;
    opacity: 0.6;
  }

  /* Date */
  .date {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(11px, 2vw, 14px);
    font-weight: 300;
    color: #555;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }

  /* Corner brackets */
  .bracket {
    position: absolute;
    width: 14px;
    height: 14px;
    opacity: 0.3;
  }
  .bracket.tl { top: -20px; left: -20px; border-top: 1px solid #dc2626; border-left: 1px solid #dc2626; }
  .bracket.tr { top: -20px; right: -20px; border-top: 1px solid #dc2626; border-right: 1px solid #dc2626; }
  .bracket.bl { bottom: -20px; left: -20px; border-bottom: 1px solid #dc2626; border-left: 1px solid #dc2626; }
  .bracket.br { bottom: -20px; right: -20px; border-bottom: 1px solid #dc2626; border-right: 1px solid #dc2626; }

  /* VENOM label */
  .label {
    position: fixed;
    bottom: 14px;
    right: 16px;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: #2a2a2a;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="glow-ring"></div>

<div class="container">
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="time">
    <span id="hours">00</span>
    <span class="colon">:</span>
    <span id="minutes">00</span>
  </div>

  <div class="seconds" id="seconds">00</div>

  <div class="divider"></div>

  <div class="date" id="date">—</div>
</div>

<div class="label">V.E.N.O.M.</div>

<script>
  const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const months = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    document.getElementById('hours').textContent = pad(now.getHours());
    document.getElementById('minutes').textContent = pad(now.getMinutes());
    document.getElementById('seconds').textContent = pad(now.getSeconds());
    document.getElementById('date').textContent =
      `${days[now.getDay()]} · ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
