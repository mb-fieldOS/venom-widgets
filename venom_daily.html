<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENOM Daily</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --red: #dc2626;
    --white: #efefef;
    --gray: #666;
    --dim: #2a2a2a;
    --border: #202020;
    --card: rgba(255,255,255,0.025);
    --bg: #191919;
  }

  html, body {
    background: #191919 !important;
    font-family: 'Share Tech Mono', monospace;
    color: var(--white);
    min-height: 100vh;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 12px;
    padding: 16px 20px 20px;
  }

  /* ── SECTION SHELL ── */
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 14px;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
  }
  .section:nth-child(2) { animation-delay: 0.08s; }
  .section:nth-child(3) { animation-delay: 0.16s; }
  .section:nth-child(4) { animation-delay: 0.24s; grid-column: 1 / -1; }

  .sec-head {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .sec-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 5px rgba(220,38,38,0.7);
    flex-shrink: 0;
  }

  .sec-title {
    font-size: 9px;
    letter-spacing: 0.45em;
    color: var(--gray);
    text-transform: uppercase;
  }

  .sec-badge {
    margin-left: auto;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--dim);
    text-transform: uppercase;
  }

  /* ── TAGESAUFGABEN ── */
  .task-list { display: flex; flex-direction: column; gap: 5px; }

  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  .task:hover { border-color: var(--border); background: rgba(255,255,255,0.03); }
  .task.done { opacity: 0.3; }
  .task.done .task-text { text-decoration: line-through; }

  .cb {
    width: 14px; height: 14px;
    border: 1px solid #2e2e2e;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }

  .task.done .cb { border-color: var(--red); background: rgba(220,38,38,0.1); }
  .check { display: none; color: var(--red); font-size: 10px; }
  .task.done .check { display: block; }

  .task-text {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #999;
    flex: 1;
    line-height: 1.3;
  }

  .task-tag {
    font-size: 8px;
    letter-spacing: 0.25em;
    color: #2a2a2a;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* ── TAGESFORTSCHRITT ── */
  .metric-list { display: flex; flex-direction: column; gap: 10px; }

  .metric {
    padding: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }

  .metric-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .metric-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--gray);
    text-transform: uppercase;
  }

  .metric-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.05em;
    color: var(--white);
    line-height: 1;
  }

  .metric-val em { font-style: normal; font-size: 11px; color: var(--red); margin-left: 2px; }

  .bar {
    height: 2px;
    background: #141414;
    margin-bottom: 6px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #7f1d1d, var(--red));
    box-shadow: 0 0 6px rgba(220,38,38,0.4);
    transition: width 0.5s cubic-bezier(0.16,1,0.3,1);
  }

  .metric-btns { display: flex; gap: 4px; }

  .mbtn {
    flex: 1; padding: 4px 0;
    background: none;
    border: 1px solid #1e1e1e;
    color: #333;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.05em;
  }

  .mbtn:hover { border-color: var(--red); color: var(--red); }
  .mbtn.sub:hover { border-color: #333; color: #555; }

  /* ── PROJEKTFORTSCHRITT ── */
  .proj-list { display: flex; flex-direction: column; gap: 14px; }

  .proj-item {}

  .proj-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .proj-name {
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--white);
    text-transform: uppercase;
  }

  .proj-pct {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--red);
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .proj-sub {
    font-size: 9px;
    letter-spacing: 0.25em;
    color: #333;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .proj-bar {
    height: 3px;
    background: #141414;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .proj-fill {
    height: 100%;
    background: linear-gradient(90deg, #7f1d1d, var(--red));
    box-shadow: 0 0 8px rgba(220,38,38,0.5);
    transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
  }

  .proj-btns { display: flex; gap: 4px; }

  .pbtn {
    padding: 3px 8px;
    background: none;
    border: 1px solid #1e1e1e;
    color: #2e2e2e;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pbtn:hover { border-color: var(--red); color: var(--red); }
  .pbtn.sub:hover { border-color: #333; color: #555; }

  /* ── LEBENSZIEL ── */
  .life-wrap {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 20px;
  }

  .life-pct-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    color: var(--red);
    letter-spacing: 0.05em;
    line-height: 1;
    text-shadow: 0 0 30px rgba(220,38,38,0.3);
  }

  .life-pct-big em { font-style: normal; font-size: 22px; color: #7f1d1d; }

  .life-center { flex: 1; }

  .life-label {
    font-size: 9px;
    letter-spacing: 0.45em;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .life-desc {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #444;
    margin-bottom: 10px;
  }

  .life-bar {
    height: 4px;
    background: #141414;
    overflow: hidden;
    position: relative;
  }

  .life-fill {
    height: 100%;
    background: linear-gradient(90deg, #450a0a, #7f1d1d, var(--red));
    box-shadow: 0 0 12px rgba(220,38,38,0.4);
    transition: width 1.2s cubic-bezier(0.16,1,0.3,1);
  }

  .life-btns {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .lbtn {
    padding: 5px 12px;
    background: none;
    border: 1px solid #1e1e1e;
    color: #2e2e2e;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .lbtn:hover { border-color: var(--red); color: var(--red); }
  .lbtn.sub:hover { border-color: #333; color: #555; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="grid">

  <!-- COL 1: TAGESAUFGABEN -->
  <div class="section">
    <div class="sec-head">
      <div class="sec-dot"></div>
      <span class="sec-title">Tagesaufgaben</span>
      <span class="sec-badge" id="day-name">—</span>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- COL 2: TAGESFORTSCHRITT -->
  <div class="section">
    <div class="sec-head">
      <div class="sec-dot"></div>
      <span class="sec-title">Tagesfortschritt</span>
      <span class="sec-badge" id="day-pct">0%</span>
    </div>
    <div class="metric-list" id="metric-list"></div>
  </div>

  <!-- COL 3: PROJEKTFORTSCHRITT -->
  <div class="section">
    <div class="sec-head">
      <div class="sec-dot"></div>
      <span class="sec-title">Projekte</span>
    </div>
    <div class="proj-list" id="proj-list"></div>
  </div>

  <!-- ROW 2: LEBENSZIEL -->
  <div class="section">
    <div class="sec-head">
      <div class="sec-dot"></div>
      <span class="sec-title">Lebensziel</span>
    </div>
    <div class="life-wrap">
      <div class="life-pct-big" id="life-pct">0<em>%</em></div>
      <div class="life-center">
        <div class="life-label">Gesamtfortschritt</div>
        <div class="life-desc" id="life-desc">Das Leben das du dir vorstellst — wie weit bist du?</div>
        <div class="life-bar"><div class="life-fill" id="life-fill" style="width:0%"></div></div>
      </div>
      <div class="life-btns">
        <button class="lbtn" onclick="adjustLife(1)">+ 1%</button>
        <button class="lbtn" onclick="adjustLife(5)">+ 5%</button>
        <button class="lbtn sub" onclick="adjustLife(-1)">− 1%</button>
      </div>
    </div>
  </div>

</div>

<script>
const DAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

const SCHEDULE = {
  0: [
    { text: 'Wochenplanung erstellen', tag: 'Planung' },
    { text: 'Einkaufsliste vorbereiten', tag: 'Vorrat' },
    { text: 'Active Recovery', tag: 'Training' },
    { text: 'Meal Prep für Montag', tag: 'Ernährung' },
    { text: 'Weekly Review FieldOS', tag: 'Arbeit' },
  ],
  1: [
    { text: 'Push Day absolvieren', tag: 'Training' },
    { text: 'FieldOS Wochenziele setzen', tag: 'Arbeit' },
    { text: 'Vorrat checken', tag: 'Vorrat' },
    { text: 'Deep Work 09–12 Uhr', tag: 'Fokus' },
  ],
  2: [
    { text: 'Pull Day absolvieren', tag: 'Training' },
    { text: 'V.E.N.O.M. Dev Session', tag: 'VENOM' },
    { text: 'Protein-Ziel erreichen', tag: 'Ernährung' },
    { text: 'Inbox auf 0', tag: 'Fokus' },
  ],
  3: [
    { text: 'Active Recovery / Cardio', tag: 'Training' },
    { text: 'Mid-Week Review', tag: 'Planung' },
    { text: 'FieldOS Fortschritt dokumentieren', tag: 'Arbeit' },
    { text: 'Decision Log updaten', tag: 'VENOM' },
  ],
  4: [
    { text: 'Leg Day absolvieren', tag: 'Training' },
    { text: 'FieldOS Feature Arbeit', tag: 'Arbeit' },
    { text: 'Einkauf wenn nötig', tag: 'Vorrat' },
    { text: 'Code Debt Check', tag: 'VENOM' },
  ],
  5: [
    { text: 'Push Day absolvieren', tag: 'Training' },
    { text: 'Weekly Review starten', tag: 'Planung' },
    { text: 'Offene Tasks schließen', tag: 'Arbeit' },
    { text: 'Feature Bible updaten', tag: 'VENOM' },
  ],
  6: [
    { text: 'Pull Day / Cardio', tag: 'Training' },
    { text: 'Einkauf erledigen', tag: 'Vorrat' },
    { text: 'Vorratsliste updaten', tag: 'VENOM' },
    { text: 'Relaxed Deep Work', tag: 'Fokus' },
  ],
};

const METRICS = [
  { id: 'wasser',   label: 'Wasser',   unit: 'L',    max: 3,    step: 0.5 },
  { id: 'protein',  label: 'Protein',  unit: 'g',    max: 180,  step: 30  },
  { id: 'kalorien', label: 'Kalorien', unit: 'kcal', max: 2500, step: 250 },
  { id: 'tasks',    label: 'Tasks',    unit: '',     max: 5,    step: 1   },
];

const PROJECTS = [
  { id: 'fieldos', name: 'FieldOS', desc: 'Software für Bau & Kanalsanierung' },
  { id: 'venom',   name: 'V.E.N.O.M.', desc: 'Personal AI Operating System' },
];

const today = new Date();
const dayKey = `venom_${today.getFullYear()}_${today.getMonth()}_${today.getDate()}`;
const globalKey = 'venom_global';

function getDay() {
  const r = localStorage.getItem(dayKey);
  return r ? JSON.parse(r) : { tasks: {}, metrics: {} };
}

function getGlobal() {
  const r = localStorage.getItem(globalKey);
  return r ? JSON.parse(r) : { projects: {}, life: 0 };
}

function saveDay(s) { localStorage.setItem(dayKey, JSON.stringify(s)); }
function saveGlobal(s) { localStorage.setItem(globalKey, JSON.stringify(s)); }

/* ── TASKS ── */
function renderTasks() {
  const state = getDay();
  const dayIndex = today.getDay();
  const items = SCHEDULE[dayIndex];
  document.getElementById('day-name').textContent = DAYS[dayIndex];
  const list = document.getElementById('task-list');
  list.innerHTML = '';

  items.forEach((item, i) => {
    const done = !!state.tasks[i];
    const el = document.createElement('div');
    el.className = `task${done ? ' done' : ''}`;
    el.innerHTML = `
      <div class="cb"><span class="check">✓</span></div>
      <span class="task-text">${item.text}</span>
      <span class="task-tag">${item.tag}</span>
    `;
    el.onclick = () => {
      const s = getDay();
      s.tasks[i] = !s.tasks[i];
      saveDay(s);
      renderTasks();
      updateDayPct();
    };
    list.appendChild(el);
  });
}

/* ── METRICS ── */
function renderMetrics() {
  const state = getDay();
  const list = document.getElementById('metric-list');
  list.innerHTML = '';

  METRICS.forEach(def => {
    const val = state.metrics[def.id] || 0;
    const pct = Math.min(100, Math.round((val / def.max) * 100));
    const el = document.createElement('div');
    el.className = 'metric';
    el.innerHTML = `
      <div class="metric-row">
        <span class="metric-label">${def.label}</span>
        <span class="metric-val">${val}<em>${def.unit}</em></span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="metric-btns">
        <button class="mbtn sub" onclick="adjustMetric('${def.id}',${-def.step},${def.max})">−</button>
        <button class="mbtn" onclick="adjustMetric('${def.id}',${def.step},${def.max})">+ ${def.step}${def.unit}</button>
      </div>
    `;
    list.appendChild(el);
  });
  updateDayPct();
}

function adjustMetric(id, delta, max) {
  const s = getDay();
  const cur = s.metrics[id] || 0;
  s.metrics[id] = Math.max(0, Math.min(max, Math.round((cur + delta) * 10) / 10));
  saveDay(s);
  renderMetrics();
}

function updateDayPct() {
  const state = getDay();
  const dayIndex = today.getDay();
  const taskTotal = SCHEDULE[dayIndex].length;
  const taskDone = Object.values(state.tasks).filter(Boolean).length;
  const taskPct = taskTotal > 0 ? (taskDone / taskTotal) * 100 : 0;

  const metricPcts = METRICS.map(d => {
    const v = state.metrics[d.id] || 0;
    return Math.min(100, (v / d.max) * 100);
  });
  const metricAvg = metricPcts.reduce((a,b) => a+b, 0) / metricPcts.length;

  const total = Math.round((taskPct + metricAvg) / 2);
  document.getElementById('day-pct').textContent = `${total}%`;
}

/* ── PROJECTS ── */
function renderProjects() {
  const g = getGlobal();
  const list = document.getElementById('proj-list');
  list.innerHTML = '';

  PROJECTS.forEach(p => {
    const pct = g.projects[p.id] || 0;
    const el = document.createElement('div');
    el.className = 'proj-item';
    el.innerHTML = `
      <div class="proj-head">
        <span class="proj-name">${p.name}</span>
        <span class="proj-pct">${pct}%</span>
      </div>
      <div class="proj-sub">${p.desc}</div>
      <div class="proj-bar"><div class="proj-fill" style="width:${pct}%"></div></div>
      <div class="proj-btns">
        <button class="pbtn sub" onclick="adjustProj('${p.id}',-1)">−1%</button>
        <button class="pbtn" onclick="adjustProj('${p.id}',1)">+1%</button>
        <button class="pbtn" onclick="adjustProj('${p.id}',5)">+5%</button>
        <button class="pbtn" onclick="adjustProj('${p.id}',10)">+10%</button>
      </div>
    `;
    list.appendChild(el);
  });
}

function adjustProj(id, delta) {
  const g = getGlobal();
  const cur = g.projects[id] || 0;
  g.projects[id] = Math.max(0, Math.min(100, cur + delta));
  saveGlobal(g);
  renderProjects();
}

/* ── LEBENSZIEL ── */
function renderLife() {
  const g = getGlobal();
  const pct = g.life || 0;
  document.getElementById('life-pct').innerHTML = `${pct}<em>%</em>`;
  document.getElementById('life-fill').style.width = `${pct}%`;
}

function adjustLife(delta) {
  const g = getGlobal();
  g.life = Math.max(0, Math.min(100, (g.life || 0) + delta));
  saveGlobal(g);
  renderLife();
}

/* ── INIT ── */
renderTasks();
renderMetrics();
renderProjects();
renderLife();
</script>
</body>
</html>
